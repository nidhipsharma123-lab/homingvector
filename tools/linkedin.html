<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn images</title>
<!--
  Screenshot this page at an exact window size to make LinkedIn images:
    ?kind=banner  1584x396  (profile/company cover; text on the right, clear of the profile photo)
    ?kind=post    1200x627  (link / post image)
    ?kind=logo    400x400   (company page logo)
  &bg=<image path relative to this page>, default ../media/hero-poster.jpg
-->
<style>
@font-face{font-family:"Host Grotesk";src:url(../fonts/HostGrotesk-latin.woff2) format("woff2");font-weight:300 800}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-500-latin.woff2) format("woff2");font-weight:500}
html,body{margin:0;background:#070707;color:#f2f0ea;font-family:"Host Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover}
.mono{font-family:"IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.word{font-weight:700;letter-spacing:.17em;text-transform:uppercase}
/* The row must be explicit. Without it the single implicit row auto-sizes to the image's natural
   height (900px wide / 16:9 = 506px), overflowing height:396px and pushing the TurtleShield /
   Turtle Eyes line below LinkedIn's 1584x396 crop. .post never had this bug because it declares
   its rows. Verified by measuring luma below y=396: YMAX 157 before, background-only after. */
.banner{width:1584px;height:396px;display:grid;grid-template-columns:900px 4px 680px;grid-template-rows:396px}
.banner>div,.post>div{min-height:0;overflow:hidden}
.banner .rule,.post .rule{background:#ff4a2b}
.banner .txt{padding:46px 56px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.post{width:1200px;height:627px;display:grid;grid-template-rows:430px 4px 193px}
.post .txt{display:flex;align-items:center;justify-content:space-between;padding:0 56px;gap:40px}
.logo{width:400px;height:400px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'banner', bg = q.get('bg') || '../media/hero-poster.jpg';
const mark = s => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><path d="M40 5H59V24" fill="none" stroke="#ff4a2b" stroke-width="4.5" stroke-linecap="square"/><path d="M24 59H5V40" fill="none" stroke="#ff4a2b" stroke-width="4.5" stroke-linecap="square"/><path d="M53 10 L4 33 L26 31 Z" fill="#f2f0ea"/><path d="M51.5 13.5 L27.5 35.5 L33 59 Z" fill="#f2f0ea"/></svg>`;
const root = document.getElementById('root');
if (kind === 'banner') {
  root.innerHTML = `<div class="banner"><div><img src="${bg}" alt=""></div><div class="rule"></div>
    <div class="txt">
      <div class="brand">${mark(58)}<span class="word" style="font-size:27px">Homingvector</span></div>
      <div style="font-size:35px;font-weight:500;line-height:1.08;letter-spacing:-.03em">When GPS goes dark,<br>the mission doesn’t.</div>
      <div class="mono" style="font-size:14px;color:#a6a49d">TurtleShield AI <span style="color:#ff4a2b">/</span> Turtle Eyes GCS</div>
    </div></div>`;
} else if (kind === 'post') {
  root.innerHTML = `<div class="post"><div><img src="${bg}" alt=""></div><div class="rule"></div>
    <div class="txt">
      <div class="brand">${mark(64)}<div><div class="word" style="font-size:26px">Homingvector</div><div class="mono" style="font-size:13px;color:#a6a49d;margin-top:8px">TurtleShield AI <span style="color:#ff4a2b">/</span> Turtle Eyes GCS</div></div></div>
      <div style="font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.025em;text-align:right">When GPS goes dark,<br>the mission doesn’t.</div>
    </div></div>`;
} else {
  root.innerHTML = `<div class="logo">${mark(260)}</div>`;
}
</script>
</body>
</html>
